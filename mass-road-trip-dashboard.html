<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>Bay State Road Trip</title>
<style>
:root{--bg:#101214;--panel:#1a1e21;--line:#2c3237;--text:#f2f4f5;--dim:#98a2a9;--sign:#0b6b45;--amber:#ffb020;--bad:#ff6b5e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--dim);font-size:15px}
#status{display:flex;align-items:center;gap:8px}
#dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
#dot.live{background:var(--amber);box-shadow:0 0 10px var(--amber)}
#dot.err{background:var(--bad)}
.sign{background:var(--sign);border:4px solid #fff;border-radius:14px;padding:18px 16px;outline:3px solid var(--sign);outline-offset:3px}
.sign small{display:block;font-size:16px;opacity:.85;margin-bottom:4px}
#town{font-size:clamp(40px,13vw,84px);font-weight:800;line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
#trivia{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:clamp(20px,5.2vw,28px);line-height:1.4;min-height:120px}
#trivia.dim{color:var(--dim)}
.row{display:flex;gap:10px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;font-weight:600;cursor:pointer;flex:1;min-height:56px}
button:active{transform:scale(.98)}
#go{background:var(--amber);color:#1a1200;border:0;font-size:clamp(22px,6vw,30px);font-weight:800;min-height:84px;width:100%;flex:none}
#go.on{background:var(--panel);color:var(--amber);border:2px solid var(--amber)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
h2{font-size:17px;font-weight:600;color:var(--dim);display:flex;justify-content:space-between}
#log{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-height:120px;overflow-y:auto;padding-bottom:14px}
#log li{background:var(--panel);border-left:5px solid var(--sign);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:18px}
#log time{color:var(--dim);font-size:15px;white-space:nowrap;text-align:right}
#empty{color:var(--dim);font-size:17px;padding:6px 2px}
@media (prefers-reduced-motion:no-preference){#dot.live{animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<header>
  <div id="status"><span id="dot"></span><span id="stxt">Tracker off</span></div>
  <span id="gps">–</span>
</header>

<section class="sign" aria-live="polite">
  <small id="lead">Waiting for GPS</small>
  <div id="town">Massachusetts</div>
</section>

<div id="trivia" class="dim">Tap Engage Travel Tracker to start. Keep this screen open while driving.</div>

<div class="row">
  <button id="replay" disabled>Replay</button>
  <button id="mute" aria-pressed="false">Voice on</button>
</div>

<button id="go">Engage Travel Tracker</button>

<h2><span>Towns crossed</span><span id="count">0</span></h2>
<ul id="log"></ul>
<p id="empty">No towns yet. Your trip log will appear here.</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MOVE_M = 250;          // re-query geocoder only after moving this far
  const MIN_GAP_MS = 5000;     // stay well under Nominatim's 1 req/sec policy
  const CONFIRM = 2;           // consecutive hits before announcing (avoids border flicker)

  let watchId = null, wakeLock = null, muted = false;
  let lastGeo = null, lastGeoAt = 0, geoBusy = false;
  let currentTown = null, candidate = null, candidateHits = 0;
  let lastSpeech = '';
  const geoCache = new Map();   // rounded coords -> town result
  const triviaCache = new Map();// town -> summary text
  let history = [];

  try { history = JSON.parse(localStorage.getItem('mass-trip-log') || '[]'); } catch (e) {}

  const dist = (a, b) => {
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
    const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  function setStatus(txt, cls) {
    $('stxt').textContent = txt;
    $('dot').className = cls || '';
  }

  /* ---------- Voice ---------- */
  function speak(text) {
    lastSpeech = text;
    $('replay').disabled = false;
    if (muted || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US') || null;
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  function unlockAudio() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  /* ---------- Geocoding ---------- */
  async function reverse(lat, lon) {
    const key = lat.toFixed(3) + ',' + lon.toFixed(3);
    if (geoCache.has(key)) return geoCache.get(key);
    const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&addressdetails=1&accept-language=en'
      + `&lat=${lat}&lon=${lon}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('Geocoder ' + res.status);
    const a = (await res.json()).address || {};
    const out = {
      state: a.state || '',
      town: a.city || a.town || a.village || a.municipality || a.hamlet || ''
    };
    geoCache.set(key, out);
    return out;
  }

  /* ---------- Trivia ---------- */
  const firstSentences = (t, n = 2) => {
    const clean = t.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
    const parts = clean.match(/[^.!?]+[.!?]+(?=\s|$)/g) || [clean];
    return parts.slice(0, n).join(' ').trim();
  };
  async function summary(title) {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')),
      { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    if (j.type === 'disambiguation' || !j.extract) return null;
    return firstSentences(j.extract);
  }
  async function trivia(town) {
    if (triviaCache.has(town)) return triviaCache.get(town);
    let text = null;
    try {
      text = await summary(`${town}, Massachusetts`) || await summary(town);
    } catch (e) {}
    text = text || 'No fun fact found for this town yet.';
    triviaCache.set(town, text);
    return text;
  }

  /* ---------- Town change ---------- */
  const fmtTime = d => d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });

  function renderLog() {
    const ul = $('log'); ul.textContent = '';
    history.slice().reverse().forEach(h => {
      const li = document.createElement('li');
      const n = document.createElement('span'); n.textContent = h.town;
      const t = document.createElement('time'); t.dateTime = h.iso; t.textContent = fmtTime(new Date(h.iso));
      li.append(n, t); ul.append(li);
    });
    $('count').textContent = history.length;
    $('empty').style.display = history.length ? 'none' : 'block';
  }
  function logTown(town) {
    history.push({ town, iso: new Date().toISOString() });
    try { localStorage.setItem('mass-trip-log', JSON.stringify(history)); } catch (e) {}
    renderLog();
  }

  async function enterTown(town) {
    currentTown = town;
    $('lead').textContent = 'Welcome to';
    $('town').textContent = town;
    $('trivia').className = ''; $('trivia').textContent = 'Looking up what makes ' + town + ' special…';
    logTown(town);
    const fact = await trivia(town);
    if (currentTown !== town) return; // moved on while loading
    $('trivia').textContent = fact;
    speak(`Welcome to ${town}. ${fact}`);
  }

  async function handleTown(r) {
    if (!/massachusetts/i.test(r.state) || !r.town) {
      $('lead').textContent = r.state ? 'Currently in' : 'Location unknown';
      $('town').textContent = r.state || '–';
      return;
    }
    if (r.town === currentTown) { candidate = null; candidateHits = 0; return; }
    if (r.town === candidate) candidateHits++; else { candidate = r.town; candidateHits = 1; }
    if (!currentTown || candidateHits >= CONFIRM) { candidate = null; candidateHits = 0; await enterTown(r.town); }
  }

  /* ---------- GPS ---------- */
  async function onPos(p) {
    const { latitude: lat, longitude: lon, accuracy, speed } = p.coords;
    const mph = speed != null ? Math.round(speed * 2.237) + ' mph · ' : '';
    $('gps').textContent = `${mph}±${Math.round(accuracy)} m`;
    setStatus('Tracking live', 'live');

    const here = { lat, lon };
    const moved = !lastGeo || dist(lastGeo, here) >= MOVE_M;
    const waited = Date.now() - lastGeoAt >= MIN_GAP_MS;
    if (!moved || !waited || geoBusy) return;

    geoBusy = true; lastGeoAt = Date.now();
    try {
      const r = await reverse(lat, lon);
      lastGeo = here;
      await handleTown(r);
    } catch (e) {
      setStatus('Lookup failed, retrying', 'err');
    } finally { geoBusy = false; }
  }
  function onErr(e) {
    const msg = e.code === 1 ? 'Location permission denied' : e.code === 2 ? 'GPS signal unavailable' : 'GPS timed out';
    setStatus(msg, 'err');
    if (e.code === 1) stop();
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function start() {
    if (!('geolocation' in navigator)) { setStatus('Geolocation not supported', 'err'); return; }
    unlockAudio();
    keepAwake();
    $('go').textContent = 'Stop tracking'; $('go').classList.add('on');
    $('lead').textContent = 'Finding your position';
    setStatus('Acquiring GPS…');
    watchId = navigator.geolocation.watchPosition(onPos, onErr,
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  }
  function stop() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    speechSynthesis.cancel();
    $('go').textContent = 'Engage Travel Tracker'; $('go').classList.remove('on');
    if ($('dot').className !== 'err') setStatus('Tracker off');
  }

  $('go').onclick = () => watchId == null ? start() : stop();
  $('replay').onclick = () => { if (lastSpeech) { const m = muted; muted = false; speak(lastSpeech); muted = m; } };
  $('mute').onclick = e => {
    muted = !muted;
    e.target.textContent = muted ? 'Voice off' : 'Voice on';
    e.target.setAttribute('aria-pressed', muted);
    if (muted) speechSynthesis.cancel();
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && watchId != null) keepAwake(); });
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  renderLog();
})();
</script>
</body>
</html>
